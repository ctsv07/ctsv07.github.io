<html>
<head>
<style>
    table caption {
        padding:10px;
        text-align: left;
        font-size: 30px;
    }
    table {
       border:1px solid #b3adad;
       border-collapse:collapse;
       padding:5px;
    }
    table th {
        border:1px solid #b3adad;
        padding:5px;
        background: #f0f0f0;
        color: #313030;
    }
    table td {
        border:1px solid #b3adad;
        text-align:center;
        padding:5px;
        background: #ffffff;
        color: #313030;
    }
    table th.strong {
	border-right:3px solid #b3adad;
    }
    table td.strong {
	border-right:3px solid #b3adad;
    }
</style>
</head>
	
<table>
<caption>%SERIES% Driver Ranking</caption>
<thead>
<tr>
    <th>Owner</th>
    <th>Driver</th>
    <th>Points</th>
    <th>Starts</th>
    <th class="strong">Points/Start</th>
    <th>All Points</th>
    <th>Num Races</th>
    <th>Points/Race</th>
    <th class="strong">Avg Finish</th>
</tr>
</thead>
<tbody>
%DRIVER_SERIES_DATA%
</tbody>
</table>
</html>
