<html>
<head>
<style>
    table caption {
        padding:10px;
        text-align: left;
        font-size: 30px;
    }
    table {
       border:1px solid #b3adad;
       border-collapse:collapse;
       padding:5px;
    }
    table th {
        border:1px solid #b3adad;
        padding:5px;
        background: #f0f0f0;
        user-select: none;
        color: #313030;
    }
    table td {
        border:1px solid #b3adad;
        text-align:center;
        padding:5px;
        background: #ffffff;
        color: #313030;
    }

    table th.strong {
        border-right:3px solid #b3adad;
    }
    table td.strong {
        border-right:3px solid #b3adad;
    }

    th::after {
        content: " ↕";
        opacity: 0.3;
        font-size: 0.8em;
    }

    th.asc::after  { content: " ↑"; opacity: 1; }
    th.desc::after { content: " ↓"; opacity: 1; }
</style>
</head>
	
<table>
<caption>%SERIES% Driver Ranking</caption>
<thead>
<tr>
    <th>Owner</th>
    <th>Driver</th>
    <th>Points</th>
    <th>Starts</th>
    <th class="strong">Points/Start</th>
    <th>All Points</th>
    <th>Num Races</th>
    <th>Points/Race</th>
    <th class="strong">Avg Finish</th>
</tr>
</thead>
<tbody>
%DRIVER_SERIES_DATA%
</tbody>
</table>
<script>
document.querySelectorAll('th').forEach((th, i) => {
  th.addEventListener('click', () => {
    const tbody = th.closest('table').querySelector('tbody');
    const rows = Array.from(tbody.querySelectorAll('tr'));
    
    const dir = th.classList.contains('asc') ? -1 : 1;
    document.querySelectorAll('th').forEach(h => h.classList.remove('asc','desc'));
    th.classList.add(dir > 0 ? 'asc' : 'desc');

    rows.sort((a,b) => {
      let x = a.children[i].textContent.trim();
      let y = b.children[i].textContent.trim();
      return (isNaN(x) || isNaN(y) ? x.localeCompare(y) : x - y) * dir;
    });

    rows.forEach(r => tbody.appendChild(r));
  });
});
</script>
</html>
