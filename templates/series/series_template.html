<html>
<head>
<style>
    table caption {
        padding:10px;
        text-align: left;
        font-size: 30px;
    }
    table {
       border:1px solid #b3adad;
       border-collapse:collapse;
       padding:5px;
    }
    table th {
        border:1px solid #b3adad;
        padding:5px;
        background: #f0f0f0;
        user-select: none;
        color: #313030;
    }
    table td {
        border:1px solid #b3adad;
        text-align:center;
        padding:5px;
        background: #ffffff;
        color: #313030;
    }

    table th.strong {
        border-right:3px solid #b3adad;
    }
    table td.strong {
        border-right:3px solid #b3adad;
    }

    /* Styles for sortable columns. */
    th::after {
        content: " ↕";
        opacity: 0.3;
        font-size: 0.8em;
    }

    th.asc::after  { content: " ↑"; opacity: 1; }
    th.desc::after { content: " ↓"; opacity: 1; }

    /* Styles for chart element */
    .chart {
        height: 70px;
        width: 150px;
        display: flex;
        align-items: flex-end;
        gap: 2px;
        padding: 2px 2px 2px 2px;
        background: #f8f9fa;
        position: relative;
    }

    .bar-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        height: 100%;
        position: relative;
    }

    .bar {
        width: 100%;
        background: linear-gradient(to top, #3498db, #5dade2);
        border-radius: 3px 3px 0 0;
        transition: all 0.4s ease;
        position: relative;
     }

     .bar:hover {
        background: linear-gradient(to top, #2980b9, #3498db);
        transform: scale(1.08);
     }

     .value {
        position: absolute;
        top: -28px;
        left: 50%;
        transform: translateX(-50%);
        background: #2c3e50;
        color: white;
        font-size: 13px;
        padding: 2px 4px;
        border-radius: 3px;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 0.3s;
    }

    .bar:hover .value {
        opacity: 1;
    }


</style>
</head>
	
<table>
<caption>%SERIES% Driver Ranking</caption>
<thead>
<tr>
    <th>Owner</th>
    <th>Driver</th>
    <th>Points</th>
    <th>Starts</th>
    <th class="strong">Points/Start</th>
    <th>All Points</th>
    <th>Num Races</th>
    <th>Points/Race</th>
    <th>Avg Finish</th>
    <th class="strong">Points History</th>
</tr>
</thead>
<tbody>
%DRIVER_SERIES_DATA%
</tbody>
</table>
<script>

/* Add sortable column headers. */
document.querySelectorAll('th').forEach((th, i) => {
  th.addEventListener('click', () => {
    const tbody = th.closest('table').querySelector('tbody');
    const rows = Array.from(tbody.querySelectorAll('tr'));
    
    const dir = th.classList.contains('asc') ? -1 : 1;
    document.querySelectorAll('th').forEach(h => h.classList.remove('asc','desc'));
    th.classList.add(dir > 0 ? 'asc' : 'desc');

    rows.sort((a,b) => {
      let x = a.children[i].textContent.trim();
      let y = b.children[i].textContent.trim();
      return (isNaN(x) || isNaN(y) ? x.localeCompare(y) : x - y) * dir;
    });

    rows.forEach(r => tbody.appendChild(r));
  });
});

/* Points history data. */
let maxValue = %MAX_POINTS%;
%DRIVER_POINTS_HISTORY_DATA%

function renderCharts() {
%DRIVER_POINTS_RENDER%
}

/* Render a points history chart. */
function renderChart(chartId, data) {
    const chart = document.getElementById(chartId);
    chart.innerHTML = '';

    // Create bars
    data.forEach(item => {
        const percentage = (item.value / maxValue) * 100;

        const barContainer = document.createElement('div');
        barContainer.className = 'bar-container';

        const bar = document.createElement('div');
        bar.className = 'bar';
        bar.style.height = percentage + '%';

        // Value popup
        const valueLabel = document.createElement('div');
        valueLabel.className = 'value';
        valueLabel.textContent = item.value;
        bar.appendChild(valueLabel);

        barContainer.appendChild(bar);
        chart.appendChild(barContainer);
    });
}

// Load chart
window.onload = renderCharts;
</script>
</html>
